name: Keep Streamlit App Awake

on:
  schedule:
    # Esegue automaticamente lo script ogni 6 ore
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Ti permette di testarlo a mano quando vuoi dalla tab "Actions" di GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Esecuzione script
        run: python keep_alive.py
