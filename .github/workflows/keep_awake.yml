import re
import sys
from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

URL = "https://wild-data.streamlit.app"

def run():
    with sync_playwright() as p:
        browser = p.chromium.launch()
        page = browser.new_page()
        try:
            # domcontentloaded invece di networkidle: Streamlit non diventa mai davvero "idle"
            page.goto(URL, wait_until="domcontentloaded", timeout=60000)

            # Se l'app dormiva, clicca il bottone di risveglio
            wake = page.get_by_role("button", name=re.compile("get this app back up", re.I))
            try:
                wake.wait_for(timeout=8000)
                wake.click()
                print("App addormentata: risveglio richiesto.")
            except PWTimeout:
                pass  # nessun bottone: l'app era già sveglia

            # Aspetta che l'app Streamlit sia davvero caricata (WebSocket attivo)
            page.wait_for_selector('[data-testid="stApp"]', timeout=90000)
            page.wait_for_timeout(10000)
            print(f"Ping eseguito con successo su: {URL}")
        except Exception as e:
            print(f"Errore durante il ping: {e}")
            sys.exit(1)
        finally:
            browser.close()

if __name__ == "__main__":
    run()
